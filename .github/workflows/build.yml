name: Build release artifacts

env:
  CRYSTAL_VERSION: 1.21.1

on:
  workflow_call:
    inputs:
      release_tag:
        description: Git tag being built, for example v0.1.0
        required: true
        type: string
    outputs:
      version:
        description: Version read from shard.yml
        value: ${{ jobs.metadata.outputs.version }}

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Match tag to shard version
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=$(awk '$1 == "version:" { print $2; exit }' shard.yml)
          if [[ -z "$version" ]]; then
            echo "shard.yml does not contain a version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match shard.yml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} x86_64
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fedora43
            image: fedora:43
            package_format: rpm
            packages: >-
              dnf install -y
              bash ca-certificates curl findutils gcc git gzip make tar xz
              gc-devel libevent-devel libyaml-devel openssl-devel pcre2-devel zlib-devel
          - platform: debian13
            image: debian:13
            package_format: deb
            packages: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              bash build-essential ca-certificates curl git gzip make pkg-config tar xz-utils
              libevent-dev libgc-dev libpcre2-dev libssl-dev libyaml-dev zlib1g-dev
          - platform: ubuntu24.04
            image: ubuntu:24.04
            package_format: deb
            packages: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              bash build-essential ca-certificates curl git gzip make pkg-config tar xz-utils
              libevent-dev libgc-dev libpcre2-dev libssl-dev libyaml-dev zlib1g-dev

    steps:
      - name: Install platform build dependencies
        shell: bash
        run: ${{ matrix.packages }}

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Crystal
        shell: bash
        run: sh scripts/install-crystal.sh

      - name: Build release binary and native package
        shell: bash
        env:
          FORMAT: ${{ matrix.package_format }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          case "$FORMAT" in
            deb)
              output="dist/via_${VERSION}_${PLATFORM}_amd64.deb"
              ;;
            rpm)
              output="dist/via-${VERSION}-1.${PLATFORM}.x86_64.rpm"
              ;;
            *)
              echo "Unsupported package format: $FORMAT" >&2
              exit 1
              ;;
          esac
          make "package-$FORMAT" VERSION="$VERSION" PACKAGE_OUTPUT="$output"

      - name: Package binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          package="via-${VERSION}-${PLATFORM}-x86_64"
          mkdir -p "dist/$package"
          install -m 0755 bin/via "dist/$package/via"
          cp CHANGELOG.md LICENSE README.md "dist/$package/"
          tar \
            --sort=name \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mtime=@0 \
            -C dist \
            -cf - "$package" |
            gzip -n > "dist/$package.tar.gz"
          (
            cd dist
            sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: via-${{ matrix.platform }}-x86_64
          path: |
            dist/via-*.tar.gz
            dist/via-*.tar.gz.sha256
            dist/via-*.rpm
            dist/via-*.rpm.sha256
            dist/via_*.deb
            dist/via_*.deb.sha256
          if-no-files-found: error
          retention-days: 7
