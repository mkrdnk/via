name: Build release artifacts

env:
  CRYSTAL_VERSION: 1.21.1

on:
  workflow_call:
    inputs:
      release_tag:
        description: Git tag being built, for example v0.1.0
        required: true
        type: string
    outputs:
      version:
        description: Version read from shard.yml
        value: ${{ jobs.metadata.outputs.version }}

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Match tag to shard version
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=$(awk '$1 == "version:" { print $2; exit }' shard.yml)
          if [[ -z "$version" ]]; then
            echo "shard.yml does not contain a version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match shard.yml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package.format }} ${{ matrix.architecture.name }}
    needs: metadata
    runs-on: ${{ matrix.architecture.runner }}
    timeout-minutes: 20
    container:
      image: ${{ matrix.package.image }}
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - name: x86_64
            runner: ubuntu-24.04
            package_arch: amd64
          - name: aarch64
            runner: ubuntu-24.04-arm
            package_arch: arm64
        package:
          - format: rpm
            image: fedora:43
            packages: >-
              dnf install -y
              bash ca-certificates curl findutils gcc git gzip make tar xz
              gc-devel libevent-devel libyaml-devel openssl-devel pcre2-devel zlib-devel
          - format: deb
            image: debian:13
            packages: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              bash build-essential ca-certificates curl git gzip make pkg-config tar xz-utils
              libevent-dev libgc-dev libpcre2-dev libssl-dev libyaml-dev zlib1g-dev
          - format: bin
            image: ubuntu:24.04
            packages: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              bash build-essential ca-certificates curl git gzip make pkg-config tar xz-utils
              libevent-dev libgc-dev libpcre2-dev libssl-dev libyaml-dev zlib1g-dev

    steps:
      - name: Install platform build dependencies
        shell: bash
        run: ${{ matrix.package.packages }}

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Crystal
        shell: bash
        run: sh scripts/install-crystal.sh

      - name: Build release package
        shell: bash
        env:
          ARCH: ${{ matrix.architecture.name }}
          FORMAT: ${{ matrix.package.format }}
          PACKAGE_ARCH: ${{ matrix.architecture.package_arch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          make "package-$FORMAT" \
            VERSION="$VERSION" \
            ARCH="$ARCH" \
            PACKAGE_ARCH="$PACKAGE_ARCH"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: via-${{ matrix.package.format }}-${{ matrix.architecture.name }}
          path: |
            dist/via-*.tar.xz
            dist/via-*.tar.xz.sha256
            dist/via-*.rpm
            dist/via-*.rpm.sha256
            dist/via-*.deb
            dist/via-*.deb.sha256
          if-no-files-found: error
          retention-days: 7
